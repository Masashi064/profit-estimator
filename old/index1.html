<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>評価損益率・利益・売却額 相互計算ツール（手動計算版）</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f6f8fb; margin: 0; color: #222; }
    .wrap { max-width: 960px; margin: 40px auto; padding: 0 16px; }
    .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 8px; border-bottom: 1px solid #eee; }
    th { color: #555; font-size: 13px; }
    input { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 8px; }
    button { background: #0a7; color: #fff; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .btn-link { background: none; color: #06a; }
    .totals { margin-top: 12px; font-weight: bold; }
    .error { color: red; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>評価損益率・利益・売却額 相互計算ツール（計算ボタン式）</h1>
      <p>3つのうち2つを入力し、「計算」ボタンを押すと残りが計算されます。</p>
      <button id="addRowBtn">＋ 行を追加</button>
      <button id="exportCsvBtn">CSVエクスポート</button>
      <button id="clearBtn" class="btn-link">リセット</button>

      <table>
        <thead>
          <tr>
            <th>評価損益率 (%)</th>
            <th>利益 (円)</th>
            <th>売却額 (円)</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <div class="totals">
        <div>利益合計: <span id="sumProfit">0</span> 円</div>
        <div>売却額合計: <span id="sumProceeds">0</span> 円</div>
      </div>
    </div>
  </div>

  <script>
    const tbody = document.getElementById('tbody');
    const addRowBtn = document.getElementById('addRowBtn');
    const clearBtn = document.getElementById('clearBtn');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const sumProfitEl = document.getElementById('sumProfit');
    const sumProceedsEl = document.getElementById('sumProceeds');

    function parseOrNull(v) {
      if (v === '' || v === null || v === undefined) return null;
      const n = Number(v);
      return isFinite(n) ? n : null;
    }

    function addRow(defaults = {}) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="number" step="0.01" class="r" placeholder="例: 184 または -35.2" value="${defaults.r ?? ''}"></td>
        <td><input type="number" step="0.01" class="g" placeholder="利益" value="${defaults.g ?? ''}"></td>
        <td><input type="number" step="0.01" class="s" placeholder="売却額" value="${defaults.s ?? ''}"></td>
        <td>
          <button class="calcBtn">計算</button>
          <button class="btn-link delBtn">削除</button>
          <div class="error"></div>
        </td>
      `;
      tbody.appendChild(tr);

      const calcBtn = tr.querySelector('.calcBtn');
      const delBtn = tr.querySelector('.delBtn');
      const errorEl = tr.querySelector('.error');

      calcBtn.addEventListener('click', () => {
        errorEl.textContent = '';
        const r = parseOrNull(tr.querySelector('.r').value);
        const g = parseOrNull(tr.querySelector('.g').value);
        const s = parseOrNull(tr.querySelector('.s').value);

        try {
          if (r !== null && g !== null && s === null) {
            if (r === 0) throw new Error('評価損益率が0%では計算不可');
            tr.querySelector('.s').value = (g * (1 + 100 / r)).toFixed(2);
          } else if (r !== null && s !== null && g === null) {
            if (r === 0) throw new Error('評価損益率が0%では計算不可');
            tr.querySelector('.g').value = (s / (1 + 100 / r)).toFixed(2);
          } else if (g !== null && s !== null && r === null) {
            const denom = s - g;
            if (denom === 0) throw new Error('売却額＝利益では計算不可');
            tr.querySelector('.r').value = ((100 * g) / denom).toFixed(3);
          } else {
            errorEl.textContent = '2つだけ入力してください。';
          }
        } catch (e) {
          errorEl.textContent = e.message;
        }

        updateTotals();
      });

      delBtn.addEventListener('click', () => {
        tr.remove();
        updateTotals();
      });
    }

    function updateTotals() {
      let totalG = 0, totalS = 0;
      tbody.querySelectorAll('tr').forEach(tr => {
        const g = parseOrNull(tr.querySelector('.g').value);
        const s = parseOrNull(tr.querySelector('.s').value);
        if (g !== null) totalG += g;
        if (s !== null) totalS += s;
      });
      sumProfitEl.textContent = totalG.toFixed(2);
      sumProceedsEl.textContent = totalS.toFixed(2);
    }

    function exportCSV() {
      const rows = [['評価損益率(%)','利益(円)','売却額(円)']];
      tbody.querySelectorAll('tr').forEach(tr => {
        const r = tr.querySelector('.r').value ?? '';
        const g = tr.querySelector('.g').value ?? '';
        const s = tr.querySelector('.s').value ?? '';
        rows.push([r,g,s]);
      });
      const csv = rows.map(r => r.join(',')).join('\r\n');
      const blob = new Blob(["\uFEFF"+csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'calc_export.csv';
      link.click();
    }

    addRowBtn.addEventListener('click', () => addRow());
    clearBtn.addEventListener('click', () => { tbody.innerHTML = ''; addRow(); updateTotals(); });
    exportCsvBtn.addEventListener('click', exportCSV);

    addRow();
  </script>
</body>
</html>
